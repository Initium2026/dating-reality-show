    function typeWriter(text, element, speed, callback) {
        if (!text) { if(callback) callback(); return; }
        let i = 0;
        element.style.whiteSpace = "pre-wrap"; 
        element.innerText = "";
        
        function type() {
            if (i < text.length) {
                element.innerText = text.substring(0, i + 1);
                i++;
                setTimeout(type, speed);
            } else if (callback) {
                callback();
            }
        }
        type();
    }
    
    function getKVBg() { return (window.innerWidth <= window.innerHeight) ? "KV_main_v.jpg" : "KV_main_h.jpg"; }
    function getCorrectBgUrl(step) { return (window.innerWidth <= window.innerHeight) ? step.bgV : (step.bgH || step.bgV); }

    function updateProgress() {
        const pCon = document.getElementById('progress-container');
        const pBar = document.getElementById('progress-bar');
        const questionSteps = script.filter(s => s.type !== "quote_text_branch" && s.type !== "start");
        const step = script[currentIdx];
        if (!step || step.type === "start") pCon.style.opacity = "0";
        else {
            pCon.style.opacity = "1";
            const qIdx = questionSteps.indexOf(step);
            if (qIdx !== -1) pBar.style.width = ((qIdx + 1) / questionSteps.length * 100) + "%";
        }
    }

    function addBtn(txt, fn, cls) {
        const b = document.createElement('button');
        b.className = cls; b.innerText = txt; b.onclick = fn;
        document.getElementById('options').appendChild(b); return b;
    }

    function renderContent(step) {
        const textEl = document.getElementById('text');
        const optEl = document.getElementById('options');
        const contentBox = document.getElementById('content-box');
        
        contentBox.scrollTop = 0;
        textEl.style.whiteSpace = "pre-wrap"; 
        textEl.style.opacity = "1";
        textEl.innerText = ""; 
        optEl.innerHTML = "";

        if (step.id === "start") {
    textEl.innerText = step.desc;
    document.getElementById('scene-label').innerText = ""; 
    
  
    const b = addBtn(step.btnText, () => { 
        currentIdx++; 
        loadStep(); 
    }, "start-btn show");
} 
        else if (step.type === "quote_text_branch") {
            const q = step.quoteTexts[lastChoiceLabel] || Object.values(step.quoteTexts)[0];
            typeWriter(q.main, textEl, 35, () => {
                const s = document.createElement('span');
                s.className = "source-text serif-text"; 
                s.innerText = q.source;
                
                const h = document.createElement('div');
                h.className = "continue-hint serif-text"; 
                h.innerText = "— 點擊螢幕繼續 —";
                
                optEl.appendChild(s); 
                optEl.appendChild(h);
                
                requestAnimationFrame(() => {
                    setTimeout(() => {
                        s.classList.add('fade-in-element');
                        h.classList.add('fade-in-element');
                    }, 100);
                });

                const container = document.getElementById('game-container');
                container.onclick = () => { 
                    container.onclick = null; 
                    currentIdx++; 
                    loadStep(); 
                };
            });
        } 
        else {
            typeWriter(step.sceneDesc, textEl, 30, () => {
                setTimeout(() => {
                    textEl.style.transition = "opacity 0.4s ease";
                    textEl.style.opacity = "0";
                    
                    setTimeout(() => {
                        textEl.innerText = step.question || "";
                        textEl.style.opacity = "1";
                        
                        const opts = step.type === "dynamic_branch" ? step.branches[lastChoiceLabel] : step.options;
                        
                        opts.forEach((o, i) => {
                            const b = addBtn(o.text, () => {
                                lastChoiceLabel = o.label;
                                
                              
                                if (step.id === "step4" || step.id === "step10") {
                                    userJourney.push(o.label);
                                }

                                if(o.scores) {
                                    Object.keys(o.scores).forEach(k => userScores[k] += o.scores[k]);
                                }
                                if(currentIdx === script.length - 1) triggerEnding();
                                else { currentIdx++; loadStep(); }
                            }, "option-btn");
                            
                            setTimeout(() => b.classList.add('show'), i * 120);
                        });
                    }, 500);
                }, 1200);
            });
        }
    }

    function loadStep() {
        const step = script[currentIdx];
        if (!step) return;

        const contentBox = document.getElementById('content-box');
        const container = document.getElementById('game-container');
        const sceneLabel = document.getElementById('scene-label');
        const titleEl = document.getElementById('title');
        const bgUrl = getCorrectBgUrl(step);

        contentBox.style.transition = "none";
        contentBox.style.opacity = "0";

        const img = new Image();
        img.src = bgUrl;

        const onImageReady = () => {
            container.style.backgroundImage = `url('${bgUrl}')`;
            sceneLabel.innerText = step.label || "";
            if (step.title) {
                titleEl.innerText = step.title;
                titleEl.style.display = "block";
            } else {
                titleEl.style.display = "none";
            }

            renderContent(step);
            updateProgress();

            setTimeout(() => {
                contentBox.style.transition = "opacity 0.6s ease";
                contentBox.style.opacity = "1";
            }, 100);
        };

        if (img.complete) {
            onImageReady();
        } else {
            img.onload = onImageReady;
            img.onerror = onImageReady;
        }
    }

    function triggerEnding() {
        document.getElementById("fixed-logo").style.display = "none";
        document.getElementById('content-box').style.opacity = "0";
        const overlay = document.getElementById('loading-overlay');
        overlay.style.display = "flex"; overlay.style.opacity = "1";
        
        const maxP = Object.keys(userScores).reduce((a, b) => userScores[a] > userScores[b] ? a : b);
        const resultImgUrl = `result_${maxP}.jpg`;
        const resScreen = document.getElementById('result-screen');
        
        resScreen.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('${getKVBg()}')`;
        document.getElementById('result-card-area').style.backgroundImage = `url('${resultImgUrl}')`;
        document.getElementById('downloadable-image').src = resultImgUrl;
        
        setTimeout(() => {
            document.getElementById('loading-msg').innerText = "分析完成。";
            setTimeout(() => {
                resScreen.style.display = "flex"; setTimeout(() => resScreen.style.opacity = "1", 50);
                overlay.style.opacity = "0"; setTimeout(() => overlay.style.display = "none", 1000);
            }, 800);
        }, 2500);
    }

    function showArticlePage() {
        document.getElementById("fixed-logo").style.display = "block";
        const listContainer = document.getElementById('article-list-container');
        listContainer.innerHTML = "";

        userJourney.forEach(label => {
            const art = articleData[label];
            if (art) {
                const card = document.createElement('div');
                card.className = "article-entry-card";
                card.onclick = () => openPreview(art);
                card.innerHTML = `
                    <div class="article-thumb" style="background-image: url('${art.img}')"></div>
                    <div class="article-title-text serif-text">${art.title}</div>
                `;
                listContainer.appendChild(card);
            }
        });

        if (userJourney.length === 0) {
            listContainer.innerHTML = "<p style='color:white; text-align:center;'>點擊下方按鈕了解更多愛慾故事</p>";
        }

        const overlay = document.getElementById('article-overlay');
        overlay.style.backgroundImage = `url('${getKVBg()}')`;
        overlay.style.display = "flex";
        setTimeout(() => overlay.style.opacity = "1", 50);
    }

    function closeArticlePage() {
        const overlay = document.getElementById('article-overlay');
        overlay.style.opacity = "0";
        setTimeout(() => overlay.style.display = "none", 500);
    }

    window.onload = loadStep;
    
    window.addEventListener("resize", () => {
        const step = script[currentIdx];
        if (!step) return;
        const container = document.getElementById('game-container');
        const bgUrl = getCorrectBgUrl(step);
        container.style.backgroundImage = `url('${bgUrl}')`;
    });
    
    let previewLink = "";

    function openPreview(article){

        previewLink = article.url;

        document.getElementById("preview-image").style.backgroundImage =
        `url('${article.img}')`;

        document.getElementById("preview-title").innerText =
        article.title;

        document.getElementById("preview-desc").innerText =
        article.desc || "";

        document.getElementById("article-preview").style.display="flex";

}

    function closePreview(e){

        if(e.target.id === "article-preview"){
            document.getElementById("article-preview").style.display="none";
        }

    }

    function startTrial(){
        if(previewLink){
            window.open(previewLink,"_blank");
        }
    }
